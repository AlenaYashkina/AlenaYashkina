<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Reconstructed AI-assisted guest message lookup"><defs><style>text{font-family:Inter,'Segoe UI',Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,monospace}</style></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#e9eef5" stroke="none"/><rect x="36" y="32" width="1368" height="838" rx="16" fill="#fff" stroke="#d5dce6"/><rect x="36" y="32" width="1368" height="52" rx="16" fill="#f8fafc" stroke="none"/><rect x="36" y="67" width="1368" height="17" rx="0" fill="#f8fafc" stroke="none"/><rect x="58" y="50" width="11" height="11" rx="6" fill="#ff6b66" stroke="none"/><rect x="77" y="50" width="11" height="11" rx="6" fill="#ffc453" stroke="none"/><rect x="96" y="50" width="11" height="11" rx="6" fill="#3ac57d" stroke="none"/><text x="715" y="64" font-size="12" fill="#7d8c9f" font-weight="500" text-anchor="middle">ChatGPT + private message search · anonymized reconstruction</text><rect x="36" y="84" width="260" height="752" rx="0" fill="#f9fafc" stroke="none"/><text x="65" y="123" font-size="19" fill="#15283f" font-weight="750" >Assistant workspace</text><text x="65" y="150" font-size="12" fill="#8393a7" font-weight="500" >Operational search</text><path d="M54 172 L277 172" stroke="#e2e8f0" stroke-width="1" fill="none"/><text x="68" y="210" font-size="12" fill="#8c99ac" font-weight="650" >Recent conversations</text><rect x="54" y="219" width="229" height="43" rx="9" fill="#eaf0fc" stroke="none"/><text x="67" y="246" font-size="13" fill="#315da4" font-weight="650" >Guest history lookup</text><text x="67" y="301" font-size="13" fill="#64748b" font-weight="450" >Apartment reference</text><text x="67" y="356" font-size="13" fill="#64748b" font-weight="450" >Maintenance follow-up</text><text x="67" y="411" font-size="13" fill="#64748b" font-weight="450" >Owner report question</text><text x="326" y="127" font-size="26" fill="#182a41" font-weight="750" >Search guest conversation</text><rect x="1171" y="107" width="153" height="26" rx="13" fill="#fff4dc" stroke="none"/><text x="1183" y="125" font-size="12" fill="#8f681f" font-weight="600" >Human review</text><rect x="332" y="163" width="1017" height="86" rx="15" fill="#f7f9fd" stroke="#e1e7f0"/><text x="358" y="194" font-size="11" fill="#71829a" font-weight="700" >USER REQUEST</text><text x="358" y="222" font-size="15" fill="#2c405a" font-weight="530" >Find the last messages about hot water for guest DEMO-GUEST-7 in APT-101.</text><rect x="332" y="278" width="1017" height="340" rx="15" fill="#fff" stroke="#dce5ef"/><text x="355" y="311" font-size="12" fill="#4570a6" font-weight="700" >ASSISTANT · Retrieved from connected records</text><path d="M355 329 L1321 329" stroke="#e2e8f0" stroke-width="1" fill="none"/><text x="355" y="357" font-size="15" fill="#233750" font-weight="400" >Found two matching entries in the private message archive.</text><rect x="353" y="380" width="951" height="75" rx="11" fill="#f4f7fb" stroke="none"/><text x="371" y="406" font-size="11" fill="#697d98" font-weight="700" >TELEGRAM MESSAGE · 05 NOV · 09:16</text><text x="371" y="433" font-size="14" fill="#2f4761" font-weight="400" >Guest: “The hot water is not working. Could somebody check it?”</text><rect x="353" y="466" width="951" height="75" rx="11" fill="#f4f7fb" stroke="none"/><text x="371" y="492" font-size="11" fill="#697d98" font-weight="700" >TELEGRAM MESSAGE · 05 NOV · 09:25</text><text x="371" y="519" font-size="14" fill="#2f4761" font-weight="400" >Operator: “We will check and update you as soon as possible.”</text><rect x="353" y="552" width="951" height="47" rx="9" fill="#edf5ff" stroke="none"/><text x="371" y="581" font-size="12" fill="#305d92" font-weight="600" >Source linkage: guest ↔ conversation ↔ booking ↔ apartment ID (Supabase)</text><rect x="332" y="636" width="1017" height="152" rx="15" fill="#fff" stroke="#dce5ef"/><text x="354" y="670" font-size="16" fill="#253b57" font-weight="700" >Suggested reply · editable draft</text><text x="354" y="703" font-size="14" fill="#31455f" font-weight="400" >Hello! We're following up on the hot-water issue and will update you after confirmation.</text><rect x="1073" y="733" width="249" height="35" rx="8" fill="#235fbd" stroke="none"/><text x="1100" y="756" font-size="13" fill="#fff" font-weight="650" >Review before sending</text><text x="356" y="761" font-size="12" fill="#7d8da2" font-weight="400" >Draft only — not sent automatically</text><rect x="36" y="836" width="1368" height="34" rx="0" fill="#f6f9fc" stroke="none"/><text x="57" y="858" font-size="11" fill="#64748b" font-weight="500" >Actual workflow uses Telegram → Supabase and ChatGPT retrieval; this is a redacted UI reconstruction, not a public guest inbox.</text></svg>