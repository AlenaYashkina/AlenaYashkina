weight="750" fill="#fff" text-anchor="middle">02</text><text x="160" y="448" font-size="21" font-weight="740" fill="#1c3551" >Work tracking and property identity</text><text x="160" y="471" font-size="13" font-weight="500" fill="#73879e" >A property catalog stays separate from Jira task status; a custom Forge field links them</text><rect x="112" y="502" width="305" height="80" rx="10" fill="#fff" stroke="#dce5ef"/><rect x="112" y="502" width="6" height="80" rx="3" fill="#c8f3e4" stroke="none"/><text x="131" y="534" font-size="17" font-weight="700" fill="#19304d" >Supabase property catalog</text><text x="131" y="558" font-size="12" font-weight="500" fill="#64778e" >Complex / apartment identifiers</text><path d="M422 542 L472 542" stroke="#8195aa" stroke-width="2.4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="476" y="502" width="299" height="80" rx="10" fill="#fff" stroke="#dce5ef"/><rect x="476" y="502" width="6" height="80" rx="3" fill="#c8f3e4" stroke="none"/><text x="495" y="534" font-size="17" font-weight="700" fill="#19304d" >Forge apartment selector</text><text x="495" y="558" font-size="12" font-weight="500" fill="#64778e" >Filtered field values in Jira</text><path d="M781 542 L832 542" stroke="#8195aa" stroke-width="2.4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="836" y="502" width="310" height="80" rx="10" fill="#fff" stroke="#dce5ef"/><rect x="836" y="502" width="6" height="80" rx="3" fill="#dbeafe" stroke="none"/><text x="855" y="534" font-size="17" font-weight="700" fill="#19304d" >Jira Cloud</text><text x="855" y="558" font-size="12" font-weight="500" fill="#64778e" >Issues · assignees · priorities</text><path d="M1152 542 L1201 542" stroke="#8195aa" stroke-width="2.4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="1205" y="502" width="282" height="80" rx="10" fill="#fff" stroke="#dce5ef"/><rect x="1205" y="502" width="6" height="80" rx="3" fill="#f9e6bb" stroke="none"/><text x="